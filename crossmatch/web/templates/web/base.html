{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rubin Crossmatch Service{% endblock %}</title>
  <!-- Bootstrap 4 + Bootstrap Icons via CDN (shared SCiMMA/Astrodash convention; no JS build tooling) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    /* Inline styling per the Astrodash convention. Palette in the SCiMMA family. */
    body {
      margin-bottom: 6rem;
      font-size: 12pt;
    }
    .container {
      max-width: 1400px;
    }
    main.container {
      padding-top: 1.5rem;
      padding-bottom: 1.5rem;
    }
    a {
      color: #2a6496;
    }
    a:hover,
    .navbar-dark .navbar-nav .nav-link:hover {
      color: #337ab7;
    }
    .navbar {
      font-size: 12pt;
    }
    .navbar-brand img {
      height: 32px;
      width: auto;
    }
    .navbar-brand .wordmark {
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    .btn-primary {
      background-color: #2a6496;
      border-color: #2a6496;
    }
    .btn-primary:hover {
      background-color: #1a4a6e;
      border-color: #1a4a6e;
    }
    .config-unset {
      color: #6c757d;
      font-style: italic;
    }
    .section-unavailable {
      color: #856404;
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
    }
    footer {
      background-color: #e3e6e8;
      padding: 16px 0;
      margin-top: 3rem;
    }
    footer a {
      color: #2a6496;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <a class="navbar-brand d-flex align-items-center" href="{% url 'web:home' %}">
      <!-- Logo slot: swap the asset in static/web/logo/ without touching layout. -->
      <img src="{% static 'web/logo/crossmatch-logo.png' %}" alt="" aria-hidden="true">
      <span class="wordmark ml-2">Rubin Crossmatch</span>
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbar-main"
      aria-controls="navbar-main" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbar-main">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item {% if active == 'home' %}active{% endif %}">
          <a class="nav-link" href="{% url 'web:home' %}">Home</a>
        </li>
        <li class="nav-item {% if active == 'catalogs' %}active{% endif %}">
          <a class="nav-link" href="{% url 'web:catalogs' %}">Catalogs</a>
        </li>
        <li class="nav-item {% if active == 'brokers' %}active{% endif %}">
          <a class="nav-link" href="{% url 'web:brokers' %}">Brokers &amp; filtering</a>
        </li>
        <li class="nav-item {% if active == 'consuming' %}active{% endif %}">
          <a class="nav-link" href="{% url 'web:consuming' %}">Consuming matches</a>
        </li>
        <li class="nav-item {% if active == 'api' %}active{% endif %}">
          <a class="nav-link" href="{% url 'web:api' %}">API</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Spacer for the fixed-top navbar. -->
  <div style="height: 4rem;"></div>

  <main class="container bg-light">
    {% block body %}{% endblock %}
  </main>

  {% include 'web/_footer.html' %}

  <!-- Bootstrap 4 JS (jQuery + Popper) for the responsive navbar collapse. -->
  <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
    integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
    integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
    integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
    crossorigin="anonymous"></script>
  {% block script %}{% endblock %}
</body>

</html>
